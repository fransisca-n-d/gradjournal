<!-- Supabase > Authentication > Emails > Templates > "Confirm sign up"
     Subject: Confirm your GradJournal account -->
<div style="background:#fffaf3;padding:32px 16px;font-family:Lato,'Segoe UI',Arial,sans-serif;color:#2f2118">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #eedfcb;border-radius:20px;padding:32px">
    <p style="margin:0 0 20px;font-size:22px;font-weight:900">Grad<span style="color:#3f6b26">Journal</span></p>
    <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25">Welcome! One click to start your journey</h1>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.55;color:#6b5444">Confirm your email so your diary, shortlist and checklists are saved to your account and waiting for you on any device.</p>
    <p style="margin:0 0 28px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#3b2a1e;color:#ffffff;text-decoration:none;font-weight:900;font-size:16px;padding:14px 24px;border-radius:12px">Confirm my email</a></p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#6b5444">If you didn't sign up for GradJournal, you can ignore this email and no account will be created.</p>
  </div>
</div>
